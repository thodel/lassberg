# Dataset configuration for HTR training
# ─────────────────────────────────────────────────────────────────────────────
# Set active_preset to one of the named presets below, or "custom".
#
# Fields per entry:
#   repo_id      HuggingFace dataset repo (required)
#   source_type  "line" (text-line crop) | "page" (full-page scan)
#   text_column  "text" (default) | "xml_content" (PageXML — text auto-extracted)
#   min_text_len minimum character count; filters near-empty rows (default: 3)
#   split        HF split to load (default: "train")
#
# Excluded datasets (reasons noted):
#   image-text_handwritten-bundesratsprotokolle_xix-xx  → auto-transcribed, no ground truth
#   image-text_historisches-grundbuch-basel_xix-xx      → auto-transcribed, no ground truth
#   salamanca_trainingdata                              → empty dataset
#   transkribus-exports-bullinger-handschrift           → private

active_preset: all

presets:

  # ── All available ground-truth datasets ─────────────────────────────────────
  all:

    # Plain text column datasets
    - repo_id: dh-unibe/image-text_kurrent-xix
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_medieval-scripts_xiv-xv-xvi
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_zh-regierungsratsprotokolle
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_historisches-grundbuch-basel_xix-xx_train
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_aaeb-xiv-xvii
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_parzival-part-1
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_rats-und-richtebuecher_xv-xvi
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_german-20th-century
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-charters-part-2
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-charters-part-3
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-charters-post-1500
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/data-towerbooks-textlines
      source_type: line
      min_text_len: 3

    # PageXML datasets — text extracted from xml_content column
    - repo_id: dh-unibe/image-text_hgb-kf_mixture
      source_type: line
      text_column: xml_content
      min_text_len: 3

    - repo_id: dh-unibe/image-text_aaeb-xiv-xvii-part-2
      source_type: line
      text_column: xml_content
      min_text_len: 3

    - repo_id: dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      source_type: line
      text_column: xml_content
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-adhr-colmar
      source_type: line
      text_column: xml_content
      min_text_len: 3

  # ── Medieval scripts only (xiv–xvi) ─────────────────────────────────────────
  medieval:
    - repo_id: dh-unibe/image-text_medieval-scripts_xiv-xv-xvi
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_parzival-part-1
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_aaeb-xiv-xvii
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_aaeb-xiv-xvii-part-2
      source_type: line
      text_column: xml_content
      min_text_len: 3

    - repo_id: dh-unibe/image-text_rats-und-richtebuecher_xv-xvi
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-charters-part-2
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-charters-part-3
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-charters-post-1500
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_koenigsfelden-adhr-colmar
      source_type: line
      text_column: xml_content
      min_text_len: 3

  # ── 19th–20th century German handwriting ────────────────────────────────────
  modern:
    - repo_id: dh-unibe/image-text_kurrent-xix
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_zh-regierungsratsprotokolle
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_historisches-grundbuch-basel_xix-xx_train
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_german-20th-century
      source_type: line
      min_text_len: 3

    - repo_id: dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      source_type: line
      text_column: xml_content
      min_text_len: 3

    - repo_id: dh-unibe/data-towerbooks-textlines
      source_type: line
      min_text_len: 3

  # ── Add your own page-level datasets here ───────────────────────────────────
  custom:
    - repo_id: dh-unibe/image-text_lassberg-letters
      source_type: page
      min_text_len: 20
